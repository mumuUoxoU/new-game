<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>むぅの大連鎖モード | new-game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    background:linear-gradient(180deg,#141033 0%,#3d2a6d 55%,#7a5fb5 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center;
    overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  h1 { font-size:20px; margin:10px 0 2px; letter-spacing:.05em; }
  h1 .heart { color:#ffe9a8; }
  #hud {
    display:flex; gap:12px; font-size:15px; margin:4px 0 8px;
    background:rgba(255,255,255,.12); padding:6px 14px; border-radius:999px;
  }
  #time { color:#ffe9a8; font-weight:bold; }
  #stage { position:relative; width:min(94vw,420px); }
  canvas {
    width:100%; display:block; border-radius:16px;
    background:linear-gradient(180deg,#1c1440 0%,#453085 70%,#6f56ad 100%);
    box-shadow:0 8px 30px rgba(0,0,0,.45);
  }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center;
    background:rgba(16,10,40,.55); border-radius:16px; padding:16px;
  }
  .overlay.hidden { display:none; }
  .overlay .big { font-size:52px; }
  .overlay p { font-size:14px; line-height:1.7; }
  button {
    font-family:inherit; font-size:17px; font-weight:bold; cursor:pointer;
    color:#4a3503; background:linear-gradient(180deg,#fff0b8,#ffd94d);
    border:none; border-radius:999px; padding:10px 28px;
    box-shadow:0 4px 0 #b8860b; transition:transform .05s;
  }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #b8860b; }
  #finalScore { font-size:22px; font-weight:bold; color:#ffe9a8; }
  .hint { font-size:12px; opacity:.85; margin-top:8px; }
</style>
</head>
<body>
<h1>むぅの大連鎖モード <span class="heart">✨</span></h1>
<div id="hud">
  <span>⭐ <span id="score">0</span></span>
  <span>⏰ <span id="time">60.0</span></span>
  <span>💗 <span id="hearts">0</span></span>
  <span>🏆 <span id="best">0</span></span>
</div>
<div id="stage">
  <canvas id="game" width="420" height="520"></canvas>
  <div class="overlay" id="startScreen">
    <div class="big">🐱✨</div>
    <p>制限時間は<b>1分</b>！スライムが大量に出てくるよ。<br>
    連鎖の得点は+1ずつ増えて上限なし！<br>
    💗を取ると<b>+1秒</b>。当たってもダウンしないよ。<br>
    0秒になっても連鎖が続いていたら、終わるまで続行！</p>
    <button id="startBtn">スタート！</button>
    <p class="hint">スマホ：ドラッグで移動、タップ長押しで星を発射<br>PC：←→キーで移動、スペースで発射</p>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="big">🌙</div>
    <div id="finalScore">0点</div>
    <p id="overMsg">おつかれさま！</p>
    <button id="retryBtn">もういちど</button>
  </div>
</div>
<p class="hint">ハードモードで10,000点を越えて解禁された最終モードだよ ✨</p>
<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const GROUND = H - 26;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const heartsEl = document.getElementById('hearts');
  const timeEl = document.getElementById('time');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const overMsgEl = document.getElementById('overMsg');

  let best = +(localStorage.getItem('muu-bakuretsu-chain-best') || 0);
  bestEl.textContent = best;

  const bgStars = Array.from({length: 70}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6 + .4, p: Math.random()*Math.PI*2
  }));
  const SLIME_COLORS = ['#b18cff','#ff9fd6','#8fe3c0','#9fc4ff','#ffd28f'];
  const MAX_SLIMES = 250; // 画面内の敵の上限

  let state = 'ready';
  let raf = 0, last = 0, elapsed = 0;
  let score = 0, heartsCollected = 0;
  let timeLeft = 60;
  let playerX = W/2;
  const playerY = H - 40, playerR = 11;
  let slimes = [], shots = [], scatters = [], drops = [], floats = [];
  let spawnTimer = 0, fireTimer = 0, pointerHeld = false;
  const keys = {};

  const overtime = () => timeLeft <= 0;
  const chainActive = () => scatters.length > 0 || shots.length > 0;
  const inScreen = s => (s.y + s.r > 0 && s.y - s.r < H && s.x + s.r > 0 && s.x - s.r < W);

  function reset() {
    score = 0; heartsCollected = 0; elapsed = 0;
    timeLeft = 60;
    slimes = []; shots = []; scatters = []; drops = []; floats = [];
    spawnTimer = .3; fireTimer = 0; playerX = W/2;
    updateHud();
  }
  function updateHud() {
    scoreEl.textContent = score;
    heartsEl.textContent = heartsCollected;
  }
  function addFloat(x, y, text, size) {
    floats.push({x, y, text, life: 1, size: size || 12});
  }
  function spawnSlime() {
    const dir = Math.random() < .5 ? -1 : 1;
    slimes.push({
      x: 26 + Math.random() * (W - 52),
      y: -30,
      vx: dir * (120 + Math.random() * 300),
      vy: 80 + Math.random() * 110,
      r: 8.5 + Math.random() * 2,
      color: SLIME_COLORS[(Math.random() * SLIME_COLORS.length) | 0]
    });
  }
  function burst(s, gen) {
    const pts = gen + 2; // 連鎖は+1ずつ、上限なし
    score += pts; updateHud();
    addFloat(s.x, s.y, '+' + pts, gen >= 10 ? 20 : gen >= 5 ? 16 : 12);
    const n = 5 + ((Math.random() * 3) | 0); // 5〜7個
    for (let i = 0; i < n; i++) {
      const ang = (-160 + Math.random() * 140) * Math.PI / 180;
      const sp = 130 + Math.random() * 130;
      scatters.push({x: s.x, y: s.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, gen: gen + 1});
    }
    if (gen >= 2 && Math.random() < .3) {
      drops.push({x: s.x, y: s.y, vy: 100});
    }
  }
  function shoot() {
    shots.push({x: playerX, y: playerY - 16, vy: -540});
  }
  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('muu-bakuretsu-chain-best', best);
      bestEl.textContent = best;
      overMsgEl.textContent = '新記録だよ！すごい！🎉';
    } else {
      overMsgEl.textContent = 'おつかれさま！また遊ぼうね💜';
    }
    finalScoreEl.textContent = score + '点';
    overScreen.classList.remove('hidden');
  }

  function drawSlime(s) {
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + 2, s.r, s.r * .82, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.ellipse(s.x - s.r * .35, s.y - s.r * .25, s.r * .28, s.r * .16, -.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2b2140';
    const er = Math.max(1.1, s.r * .16);
    ctx.beginPath();
    ctx.arc(s.x - s.r * .32, s.y, er, 0, 7);
    ctx.arc(s.x + s.r * .32, s.y, er, 0, 7);
    ctx.fill();
    ctx.strokeStyle = '#2b2140'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(s.x, s.y + 1.5, s.r * .26, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of bgStars) {
      ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t / 700 + s.p));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(0, GROUND, W, 26);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const s of slimes) if (inScreen(s)) drawSlime(s);
    for (const d of drops) { ctx.font = '12px serif'; ctx.fillText('💗', d.x, d.y); }
    for (const sh of shots) { ctx.font = '11px serif'; ctx.fillText('⭐', sh.x, sh.y); }
    for (const sc of scatters) { ctx.font = '8px serif'; ctx.fillText('⭐', sc.x, sc.y); }
    // むぅ（ノーマルの半分のサイズ）
    ctx.font = '22px serif';
    ctx.fillText('🐱', playerX, playerY);
    ctx.font = '10px serif';
    ctx.fillText('💜', playerX, playerY - 15);
    if (state === 'play' && overtime()) {
      ctx.fillStyle = '#ffe9a8';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('✨ 連鎖中…！ ✨', W/2, 30);
    }
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = '#ffe9a8';
      ctx.font = 'bold ' + f.size + 'px sans-serif';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function step(ts) {
    raf = requestAnimationFrame(step);
    const dt = Math.min(.05, (ts - last) / 1000 || 0);
    last = ts;

    if (state !== 'play') { draw(ts); return; }
    elapsed += dt;
    if (timeLeft > 0) timeLeft -= dt;
    timeEl.textContent = overtime() ? '連鎖中！' : Math.max(0, timeLeft).toFixed(1);

    const canControl = !overtime();
    if (canControl) {
      if (keys['ArrowLeft'])  playerX -= 330 * dt;
      if (keys['ArrowRight']) playerX += 330 * dt;
      playerX = Math.max(18, Math.min(W - 18, playerX));
      if (pointerHeld) {
        fireTimer -= dt;
        if (fireTimer <= 0) { shoot(); fireTimer = .2; }
      }
    }

    // 出現（ハードの5倍のスピード、画面内は最大250体まで）
    if (!overtime()) {
      spawnTimer -= dt;
      const base = Math.max(.5, 1.0 - elapsed * .008);
      if (spawnTimer <= 0 && slimes.length < MAX_SLIMES) { spawnSlime(); spawnTimer = base / 5; }
    }

    // スライム：重力＋左/右/下で跳ね返る（横・落下はハードの2倍）
    for (const s of slimes) {
      s.vy += 480 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < s.r) { s.x = s.r; s.vx = Math.abs(s.vx); }
      if (s.x > W - s.r) { s.x = W - s.r; s.vx = -Math.abs(s.vx); }
      const floorY = GROUND - s.r;
      if (s.y > floorY) {
        s.y = floorY;
        s.vy = -Math.abs(s.vy) * .9;
        if (Math.abs(s.vy) < 140) {
          s.vy = -(180 + Math.random() * 140);
          s.vx += (Math.random() * 240 - 120);
          s.vx = Math.max(-520, Math.min(520, s.vx));
        }
      }
    }

    // 自分の星
    const aliveShots = [];
    for (const sh of shots) {
      sh.y += sh.vy * dt;
      if (sh.y > -20) aliveShots.push(sh);
    }
    shots = aliveShots;

    // 星×スライム（画面内だけ）
    const hitSlimes = new Set(), usedShots = new Set();
    shots.forEach((sh, i) => {
      slimes.forEach((s, j) => {
        if (hitSlimes.has(j) || usedShots.has(i)) return;
        if (!inScreen(s)) return;
        if (Math.hypot(sh.x - s.x, sh.y - s.y) < s.r + 6) {
          hitSlimes.add(j); usedShots.add(i); burst(s, 0);
        }
      });
    });
    shots = shots.filter((_, i) => !usedShots.has(i));
    slimes = slimes.filter((_, j) => !hitSlimes.has(j));

    // 飛び散った星（画面外に出るまで消えない）
    const aliveSc = [];
    for (const sc of scatters) {
      sc.vy += 260 * dt;
      sc.x += sc.vx * dt;
      sc.y += sc.vy * dt;
      let consumed = false;
      for (let j = 0; j < slimes.length; j++) {
        const s = slimes[j];
        if (!inScreen(s)) continue;
        if (Math.hypot(sc.x - s.x, sc.y - s.y) < s.r + 5) {
          burst(s, sc.gen);
          slimes.splice(j, 1);
          consumed = true;
          break;
        }
      }
      if (consumed) continue;
      if (sc.y < H + 12 && sc.x > -16 && sc.x < W + 16 && sc.y > -50) aliveSc.push(sc);
    }
    scatters = aliveSc;

    // ハート（取ると+1秒）
    const aliveDrops = [];
    for (const d of drops) {
      d.y += d.vy * dt;
      if (Math.abs(d.x - playerX) < 24 && Math.abs(d.y - playerY) < 24) {
        heartsCollected++; updateHud();
        timeLeft += 1;
        addFloat(playerX, playerY - 26, '💗 +1秒！', 13);
        continue;
      }
      if (d.y < GROUND - 4) aliveDrops.push(d);
    }
    drops = aliveDrops;

    for (const f of floats) { f.y -= 34 * dt; f.life -= dt * .9; }
    floats = floats.filter(f => f.life > 0);

    // 0秒で連鎖が終わっていたら終了
    if (overtime() && !chainActive()) { gameOver(); draw(ts); return; }

    draw(ts);
  }

  function start() {
    reset();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    state = 'play';
    timeEl.textContent = '60.0';
    last = performance.now();
  }

  function pointX(e) {
    const r = cv.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }
  cv.addEventListener('pointerdown', e => {
    if (state === 'play' && !overtime()) {
      playerX = pointX(e);
      pointerHeld = true;
      shoot(); fireTimer = .2;
    }
  });
  window.addEventListener('pointermove', e => {
    if (pointerHeld && state === 'play' && !overtime()) playerX = pointX(e);
  });
  window.addEventListener('pointerup', () => pointerHeld = false);
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === 'play' && !overtime() && e.key === ' ' && !e.repeat) { shoot(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  last = performance.now();
  raf = requestAnimationFrame(step);
})();
</script>
</body>
</html>
